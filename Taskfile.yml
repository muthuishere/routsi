version: "3"

vars:
  VERSION:
    sh: git describe --tags --always 2>/dev/null || echo dev

tasks:
  dev:
    desc: Run routsi with models.yaml
    cmds:
      - go run ./cmd/routsi serve -config models.yaml

  test:
    desc: Vet + all tests
    cmds:
      - go vet ./...
      - go test ./...

  matrix:
    desc: Print the capability matrix (every transport x every capability, e2e)
    cmds:
      - go test ./internal/server -run CapabilityMatrix -v -count=1 | sed -n '/routsi capability matrix/,/^--- PASS/p'

  ui:
    desc: Build the dashboard (ui/ React app -> internal/server/public, embedded)
    dir: ui
    sources: ["src/**/*", "index.html", "package.json", "vite.config.ts"]
    generates: ["../internal/server/public/index.html"]
    cmds:
      - npm ci --silent || npm install --silent
      - npm run build

  ui:dev:
    desc: Dashboard with hot reload (proxies the API to a routsi on :11080)
    dir: ui
    cmds:
      - npm run dev

  build:
    desc: Build the routsi binary (version-stamped; run `task ui` after UI edits)
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/routsi ./cmd/routsi

  install:
    desc: Build and install routsi to ~/.local/bin
    deps: [build]
    cmds:
      - install -m 0755 bin/routsi ~/.local/bin/routsi
      - echo "installed ~/.local/bin/routsi — run 'routsi install' to run it as a service"
