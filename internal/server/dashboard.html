<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>routsi</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#151922; --line:#232936; --fg:#e8ecf3; --mut:#8a93a6;
    --acc:#5b9dff; --ok:#3fb950; --warn:#f0883e; --err:#f85149;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --fg:#1a1f29; --mut:#5b6472; --acc:#2563eb; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:baseline;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:20px;letter-spacing:-.02em}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 8px var(--ok)}
  header .sub{color:var(--mut);font-size:13px}
  .wrap{padding:24px;max-width:1100px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .card .v{font-size:28px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
  .card .v small{font-size:14px;color:var(--mut);font-weight:400}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:right;padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  tr:last-child td{border-bottom:none}
  .model{font-weight:600}
  .prov{color:var(--mut);font-size:12px}
  .bar{height:6px;border-radius:3px;background:var(--acc);margin-top:5px;min-width:2px}
  .err{color:var(--err)}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;background:var(--line);color:var(--mut)}
  footer{color:var(--mut);font-size:12px;text-align:center;padding:20px}
  .empty{color:var(--mut);text-align:center;padding:40px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>routsi</h1>
  <span class="sub" id="uptime">—</span>
</header>
<div class="wrap">
  <div class="cards" id="cards"></div>
  <div id="tablewrap"></div>
</div>
<footer>auto-refreshing every 3s · <span id="ts"></span></footer>
<script>
const fmt = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n);
function dur(s){ const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d) return d+'d '+h+'h'; if(h) return h+'h '+m+'m'; if(m) return m+'m '+(s%60)+'s'; return s+'s'; }

const TOKEN = new URLSearchParams(location.search).get('token');
async function tick(){
  const opts = TOKEN ? {headers:{Authorization:'Bearer '+TOKEN}} : {};
  let r, d; try{ r = await fetch('/stats', opts); if(r.status===401){ showAuth(); return; } d = await r.json(); }catch(e){ return; }
  document.getElementById('uptime').textContent = 'up '+dur(d.uptime_seconds);
  document.getElementById('ts').textContent = new Date().toLocaleTimeString();

  const errRate = d.total_requests ? (100*d.total_errors/d.total_requests).toFixed(1) : '0.0';
  const cards = [
    ['Requests', fmt(d.total_requests)],
    ['Routed', fmt(d.routed_requests), 'auto/dynamic'],
    ['Bypass', fmt(d.bypass_requests), 'named model'],
    ['Errors', fmt(d.total_errors), errRate+'%'],
    ['Models used', fmt(d.models.length)],
  ];
  document.getElementById('cards').innerHTML = cards.map(c=>
    `<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}${c[2]?` <small>${c[2]}</small>`:''}</div></div>`
  ).join('');

  if(!d.models.length){
    document.getElementById('tablewrap').innerHTML = '<div class="empty">No requests yet. Point an OpenAI client at this server and send one.</div>';
    return;
  }
  const max = Math.max(...d.models.map(m=>m.requests));
  const rows = d.models.map(m=>{
    const tok = m.prompt_tokens+m.completion_tokens;
    const w = Math.max(2, Math.round(100*m.requests/max));
    return `<tr>
      <td><div class="model">${esc(m.model)}</div><div class="prov">${esc(m.provider||'')}</div>
          <div class="bar" style="width:${w}%"></div></td>
      <td>${fmt(m.requests)}</td>
      <td>${m.escalations?`<span class="tag">${m.escalations}</span>`:'—'}</td>
      <td>${tok?fmt(tok):'—'}</td>
      <td>${m.avg_latency_ms}<small style="color:var(--mut)">ms</small></td>
      <td>${m.max_latency_ms}<small style="color:var(--mut)">ms</small></td>
      <td class="${m.errors?'err':''}">${m.errors||'—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('tablewrap').innerHTML =
    `<table><thead><tr><th>Model</th><th>Requests</th><th>Escalations</th><th>Tokens</th><th>Avg</th><th>Max</th><th>Errors</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function showAuth(){
  document.getElementById('tablewrap').innerHTML =
    '<div class="empty">401 — this server requires a token. Open <code>/?token=YOUR_TOKEN</code>.</div>';
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
