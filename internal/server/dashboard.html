<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>routsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b14; --ink-2:#12121f; --panel:#161627; --panel-2:#1c1c30;
    --line:rgba(255,255,255,.09); --fg:#ececf4; --fg-dim:#a9a9c2; --fg-mute:#7a7a95;
    --violet:#8b7bff; --violet-deep:#6c5ce7; --cyan:#3fe0d0; --cyan-deep:#18b6c9;
    --amber:#ff9a55; --coral:#ff6b6b;
    --grad: linear-gradient(120deg,#8b7bff 0%,#6c5ce7 45%,#18b6c9 100%);
    /* semantic aliases used throughout */
    --bg:var(--ink); --mut:var(--fg-dim); --acc:var(--violet);
    --ok:var(--cyan); --warn:var(--amber); --err:var(--coral);
  }
  @media (prefers-color-scheme: light){
    :root{
      --ink:#f7f7fb; --ink-2:#f0f0f8; --panel:#ffffff; --panel-2:#ffffff;
      --line:rgba(25,25,39,.10); --fg:#191927; --fg-dim:#5a5a72; --fg-mute:#83839a;
      --violet:#6c5ce7; --violet-deep:#5b4bd1; --cyan:#0e9fb0; --cyan-deep:#0b8494;
      --amber:#e07f2e; --coral:#e5514f;
      --grad: linear-gradient(120deg,#6c5ce7 0%,#5b4bd1 45%,#0e9fb0 100%);
      --bg:var(--ink); --mut:var(--fg-dim); --acc:var(--violet);
      --ok:var(--cyan); --warn:var(--amber); --err:var(--coral);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:baseline;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);background:var(--ink-2)}
  header h1{margin:0;font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);display:inline-block;box-shadow:0 0 10px var(--cyan)}
  header .sub{color:var(--mut);font-size:13px;font-family:'JetBrains Mono',monospace}
  .wrap{padding:24px;max-width:1100px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:.8}
  .card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
  .card .v{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
  .card .v small{font-size:14px;color:var(--mut);font-weight:400;font-family:'Inter',sans-serif}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:right;padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;font-size:13px}
  th:first-child,td:first-child{text-align:left;font-family:'Inter',sans-serif}
  th{color:var(--mut);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-family:'Inter',sans-serif}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel-2)}
  .model{font-weight:600;font-family:'Space Grotesk',sans-serif}
  .prov{color:var(--mut);font-size:12px;font-family:'Inter',sans-serif}
  .bar{height:6px;border-radius:3px;background:var(--grad);margin-top:5px;min-width:2px}
  .err{color:var(--coral)}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;background:var(--panel-2);color:var(--violet);border:1px solid var(--line);font-family:'Inter',sans-serif}
  footer{color:var(--mut);font-size:12px;text-align:center;padding:20px;font-family:'JetBrains Mono',monospace}
  .empty{color:var(--mut);text-align:center;padding:40px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .wdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>routsi</h1>
  <span class="sub" id="uptime">—</span>
</header>
<div class="wrap">
  <div class="cards" id="cards"></div>
  <div id="workerswrap"></div>
  <div id="tablewrap"></div>
</div>
<footer>auto-refreshing every 3s · <span id="ts"></span></footer>
<script>
const fmt = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n);
function dur(s){ const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d) return d+'d '+h+'h'; if(h) return h+'h '+m+'m'; if(m) return m+'m '+(s%60)+'s'; return s+'s'; }

const TOKEN = new URLSearchParams(location.search).get('token');
async function tick(){
  const opts = TOKEN ? {headers:{Authorization:'Bearer '+TOKEN}} : {};
  let r, d; try{ r = await fetch('/stats', opts); if(r.status===401){ showAuth(); return; } d = await r.json(); }catch(e){ return; }
  document.getElementById('uptime').textContent = 'up '+dur(d.uptime_seconds);
  document.getElementById('ts').textContent = new Date().toLocaleTimeString();

  const errRate = d.total_requests ? (100*d.total_errors/d.total_requests).toFixed(1) : '0.0';
  const cards = [
    ['Requests', fmt(d.total_requests)],
    ['Routed', fmt(d.routed_requests), 'auto/dynamic'],
    ['Bypass', fmt(d.bypass_requests), 'named model'],
    ['Errors', fmt(d.total_errors), errRate+'%'],
    ['Models used', fmt(d.models.length)],
  ];
  document.getElementById('cards').innerHTML = cards.map(c=>
    `<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}${c[2]?` <small>${c[2]}</small>`:''}</div></div>`
  ).join('');

  if(!d.models.length){
    document.getElementById('tablewrap').innerHTML = '<div class="empty">No requests yet. Point an OpenAI client at this server and send one.</div>';
    return;
  }
  const max = Math.max(...d.models.map(m=>m.requests));
  const rows = d.models.map(m=>{
    const tok = m.prompt_tokens+m.completion_tokens;
    const w = Math.max(2, Math.round(100*m.requests/max));
    return `<tr>
      <td><div class="model">${esc(m.model)}</div><div class="prov">${esc(m.provider||'')}</div>
          <div class="bar" style="width:${w}%"></div></td>
      <td>${fmt(m.requests)}</td>
      <td>${m.escalations?`<span class="tag">${m.escalations}</span>`:'—'}</td>
      <td>${tok?fmt(tok):'—'}</td>
      <td>${m.avg_latency_ms}<small style="color:var(--mut)">ms</small></td>
      <td>${m.max_latency_ms}<small style="color:var(--mut)">ms</small></td>
      <td class="${m.errors?'err':''}">${m.errors||'—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('tablewrap').innerHTML =
    `<table><thead><tr><th>Model</th><th>Requests</th><th>Escalations</th><th>Tokens</th><th>Avg</th><th>Max</th><th>Errors</th></tr></thead><tbody>${rows}</tbody></table>`;

  tickWorkers();
}

const STATE_COLOR = {online:'var(--ok)', busy:'var(--warn)', stale:'var(--mut)', reserved:'var(--line)'};
async function tickWorkers(){
  const opts = TOKEN ? {headers:{Authorization:'Bearer '+TOKEN}} : {};
  let d; try{ const r = await fetch('/v1/workers', opts); if(!r.ok){ document.getElementById('workerswrap').innerHTML=''; return; } d = await r.json(); }catch(e){ return; }
  const ws = (d.workers||[]);
  if(!ws.length){ document.getElementById('workerswrap').innerHTML=''; return; }
  const rows = ws.sort((a,b)=>a.name<b.name?-1:1).map(w=>{
    const seen = w.last_seen_sec<0 ? '—' : dur(w.last_seen_sec)+' ago';
    return `<tr>
      <td><span class="wdot" style="background:${STATE_COLOR[w.state]||'var(--mut)'}"></span><b>${esc(w.name)}</b>
          <span class="prov">${w.state}</span></td>
      <td>${seen}</td><td>${w.in_flight||'—'}</td><td>${w.served||'—'}</td>
      <td class="${w.errored?'err':''}">${w.errored||'—'}</td>
      <td class="prov" style="text-align:left">${w.last_error?esc(w.last_error):''}</td>
    </tr>`;
  }).join('');
  document.getElementById('workerswrap').innerHTML =
    `<h2 style="font-size:14px;color:var(--mut);margin:8px 4px">Workers</h2>
     <table style="margin-bottom:20px"><thead><tr><th>Queue</th><th>Last seen</th><th>In-flight</th><th>Served</th><th>Errors</th><th>Last error</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function showAuth(){
  document.getElementById('tablewrap').innerHTML =
    '<div class="empty">401 — this server requires a token. Open <code>/?token=YOUR_TOKEN</code>.</div>';
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
