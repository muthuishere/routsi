services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: routsi-dev
      MINIO_ROOT_PASSWORD: routsi-dev-password
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - routsi-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 20

  create-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 routsi-dev routsi-dev-password &&
        mc mb --ignore-existing local/routsi-analytics

volumes:
  routsi-minio:
