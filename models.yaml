# routsi config. Ask for model "auto" to route; ask for a concrete
# name to bypass routing entirely. Every scalar value supports ${VAR}
# expansion. Fields ending in _env already expect a variable name and remain
# unexpanded. API keys are env-var names, never values.
listen: ":11080"
default: gpt-cheap
sticky_ttl: 10m

# Pull-workers (ADR-001): a remote agent registers a queue and answers requests
# routed to it. No worker auth in v1 — reserved placeholder:
workers:
  auth: {}
  # freshness: 30s   # optional — worker considered "present" if it polled within this
  # max_wait: 5m     # optional — cap on how long a request blocks for a worker
# A config-declared queue reserves a name (workers also register dynamically):
#   - name: my-remote-agent
#     type: queue

# routsi config. Dashboard at http://<listen>/  ·  /stats (json)  ·  /metrics (prom).
# May also live at ~/.config/routsi/models.yaml. Run as a service: `routsi install`.
#
# Secrets: on startup routsi layers env vars (highest first): process env >
# -env/ROUTSI_ENV_FILE > ./.env > ~/.config/routsi/.env (values never logged) —
# put provider keys / ROUTSI_TOKENS in whichever .env suits you instead of your
# shell profile. Keys are always referenced BY NAME below.

# --- Inbound auth (optional). When tokens are set, /v1/* + /stats + /metrics
# require `Authorization: Bearer <token>` (dashboard: open /?token=...).
# Tokens live in an ENV VAR — never put values in this file.
# auth:
#   tokens_env: ROUTSI_TOKENS      # e.g. export ROUTSI_TOKENS="tok1,tok2"

# --- TLS / mTLS (optional). cert+key => HTTPS; client_ca additionally
# REQUIRES and verifies client certificates (mutual TLS).
# tls:
#   cert: /path/server.crt
#   key: /path/server.key
#   client_ca: /path/clients-ca.crt

# `auto` routes over these levels (cheap/strong accepted as aliases of low/high).
tiers:
  cheap: gpt-cheap
  strong: gpt-strong

# --- Custom decider (optional, docs/adr/007). Replaces the built-in Rules
# scorer for `auto`/dynamic routing with your own subprocess, any
# executable/runtime. stdin gets a JSON request (model/conversation_id/
# messages/levels/tiers); stdout must print {"level":"low|medium|high"}. Any
# failure (crash, timeout, bad output) falls back to Rules — never breaks
# routing. See examples/README.md for the full contract + copyable scripts.
# decider:
#   command: "node examples/decider.js"
#   timeout: 3s

# --- Durable analytics (optional). Request metadata and token counts are
# buffered off the inference path and uploaded as partitioned JSONL objects to
# any S3-compatible bucket. Prompts, responses, tool arguments, credentials,
# and raw conversation ids are never stored.
# analytics:
#   bucket: routsi-analytics
#   prefix: routsi/usage
#   region: us-east-1
#   profile: default             # optional; standard AWS credential chain
#   # Any S3-compatible service; ${VAR} values expand at runtime:
#   # access_key: ${ROUTSI_S3_ACCESS_KEY}
#   # secret_key: ${ROUTSI_S3_SECRET_KEY}
#   # session_token: ${ROUTSI_S3_SESSION_TOKEN}  # optional
#   flush_interval: 10s
#   batch_size: 100
#   # MinIO/R2/other S3-compatible storage:
#   # endpoint: http://127.0.0.1:9000
#   # use_path_style: true

# Dynamic virtual models: ask for "dynamic-1" and the task is classified
# (low|medium|high) and dispatched to the mapped member — any catalog model
# works, including discovered variants and CLI agents. Conversations pin to
# their member and only ever escalate.
# - name: dynamic-1
#   type: dynamic
#   levels:
#     low: gpt-cheap
#     medium: openai/gpt-4o-mini
#     high: devin/claude-opus-4.8

models:
  # OpenRouter gives every hosted model through one key (live-verified:
  # haiku + gemini-flash + streaming + dynamic groups over these members).
  - name: openrouter
    type: forward
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    variants:
      - anthropic/claude-haiku-4.5
      - google/gemini-3.5-flash
    # discover_models: true  # or pull the full OpenRouter catalog (capped 100)

  - name: gpt-cheap
    type: forward            # openai style = raw byte passthrough
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    upstream_model: deepseek-chat

  - name: gpt-strong
    type: forward
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    upstream_model: gpt-5.2

  # Anthropic-style upstream translated via toolnexus:
  # - name: claude
  #   type: forward
  #   style: anthropic
  #   base_url: https://api.anthropic.com
  #   api_key_env: ANTHROPIC_API_KEY
  #   upstream_model: claude-sonnet-5

  # Custom Go handler (register in code: reg.Register("my-handler", impl)):
  # - name: my-agent
  #   type: custom
  #   handler: my-handler

  # --- Optional built-in providers and adapters. Every example below is
  # commented out, so none is initialized or used until deliberately enabled.

  # Built-in Devin: direct HTTP/Connect + protobuf. No Devin CLI at inference.
  # - name: devin
  #   type: subscription
  #   provider: devin
  #   upstream_model: SWE-1.6 Slow             # optional label or wire UID

  # Built-in Claude on AWS: direct Bedrock Converse + SigV4. Reuses the AWS
  # SDK credential chain (`aws login`, SSO profile, role, or environment).
  # - name: claude-aws
  #   type: subscription
  #   provider: claude-bedrock
  #   upstream_model: YOUR_ENABLED_BEDROCK_MODEL_OR_PROFILE_ID
  #   aws_region: us-east-1                    # optional when profile/env supplies it
  #   aws_profile: default                     # optional

  # Local Llama: any local runtime exposing an OpenAI-compatible endpoint,
  # such as llama.cpp server. Change the model name/port for your runtime.
  # - name: llama-local
  #   type: forward
  #   provider: llama-local
  #   base_url: http://127.0.0.1:8080/v1
  #   upstream_model: local-model

  # Simple JavaScript adapter shipped by `routsi install --adapters`.
  # - name: js-example
  #   type: command
  #   provider: local-js
  #   command: node $ROUTSI_ADAPTERS/echo-tools.js
  #   timeout: 30s
  #   tools: native
  #
  # This file may also live at ~/.config/routsi/models.yaml.
